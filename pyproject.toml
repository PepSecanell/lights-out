[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lights-out"
version = "0.1.0"
description = "Run Claude Code jobs unattended overnight on your own laptop, safely: one agent at a time, usage-limit aware, never while you're busy, and a morning report."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["tomli>=1.1; python_version < '3.11'"]
keywords = ["claude", "claude-code", "agents", "scheduler", "launchd", "cron", "automation"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]

[project.scripts]
lightsout = "lightsout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lightsout = ["templates/*.toml"]
